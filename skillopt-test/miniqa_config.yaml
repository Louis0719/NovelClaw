# SkillOpt 配置 — MiniMax后端 + 自定义MiniQA数据集
model:
  backend: minimax_chat
  optimizer: MiniMax-M2.7-highspeed
  target: MiniMax-M2.7-highspeed
  optimizer_backend: minimax_chat
  target_backend: minimax_chat
  reasoning_effort: medium
  rewrite_reasoning_effort: ""
  rewrite_max_completion_tokens: 8000
  minimax_base_url: "https://api.minimax.chat/v1"
  minimax_model: "MiniMax-M2.7-highspeed"
  minimax_temperature: "0.7"
  minimax_max_tokens: "8000"
  minimax_enable_thinking: "false"

train:
  num_epochs: 1
  train_size: 0
  batch_size: 5
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 3
  merge_batch_size: 3
  analyst_workers: 2
  max_analyst_rounds: 1
  failure_only: true

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  slow_update_samples: 0
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: false

env:
  name: searchqa
  skill_init: /Users/wushixiaoshenxian/openclaw-workspace/skillopt-test/initial_skill.md
  split_mode: split_dir
  split_seed: 42
  split_dir: /Users/wushixiaoshenxian/openclaw-workspace/skillopt-test/miniqa
  exec_timeout: 60
  out_root: /Users/wushixiaoshenxian/openclaw-workspace/skillopt-test/outputs
